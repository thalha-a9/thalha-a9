<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Terminal session showing Thalha's specializations">
  <title>root@thalha:~# live terminal</title>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06121a"/>
      <stop offset="1" stop-color="#040a0c"/>
    </linearGradient>
    <pattern id="tscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00ff9c" fill-opacity="0.045"/>
    </pattern>
    <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="l1"><rect x="30" y="62" width="0" height="22"><animate attributeName="width" values="0;0;189;189;189;0" keyTimes="0;0.0136;0.0612;0.94;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="30" y="130" width="0" height="22"><animate attributeName="width" values="0;0;360;360;360;0" keyTimes="0;0.102;0.1632;0.94;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l8"><rect x="30" y="284" width="0" height="22"><animate attributeName="width" values="0;0;396;396;396;0" keyTimes="0;0.2856;0.3604;0.94;0.97;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="tframe"><rect x="0" y="0" width="900" height="400" rx="10"/></clipPath>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .s { font-size: 13px; }
      .p { fill: #00ff9c; }
      .o { fill: #8bb8ac; }
      .blink { animation: bl 1s steps(1) infinite; }
      @keyframes bl { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
      @media (prefers-reduced-motion: reduce) { .blink { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#tframe)">
    <rect width="900" height="400" fill="url(#tbg)"/>
    <rect width="900" height="400" fill="url(#tscan)"/>

    <!-- window chrome -->
    <rect x="0" y="0" width="900" height="38" fill="#0a1c22"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#00ff9c" stroke-opacity=".25"/>
    <circle cx="22" cy="19" r="5.5" fill="#ff5f57"/>
    <circle cx="42" cy="19" r="5.5" fill="#febc2e"/>
    <circle cx="62" cy="19" r="5.5" fill="#28c840"/>
    <text class="m s" x="450" y="24" text-anchor="middle" fill="#4d7f6d">thalha@recon — zsh — 120×32</text>

    <!-- line 1 : whoami -->
    <g clip-path="url(#l1)">
      <text class="m" x="30" y="78"><tspan class="p">root@thalha</tspan><tspan fill="#4d7f6d">:~#</tspan><tspan class="o" fill="#dff7ef"> whoami</tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0748;0.0884;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text class="m s" x="30" y="108" fill="#8bb8ac">↳ thalha :: developer &#38; security researcher — builds what the scanners miss</text>
    </g>

    <!-- line 3 : cat specializations -->
    <g clip-path="url(#l3)">
      <text class="m" x="30" y="146"><tspan class="p">root@thalha</tspan><tspan fill="#4d7f6d">:~#</tspan><tspan fill="#dff7ef"> cat ./specializations.txt</tspan></text>
    </g>

    <!-- spec bars -->
    <g class="m s">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1768;0.1904;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
        <text x="30" y="182" fill="#00ff9c">[01] NETWORK SECURITY</text>
        <rect x="300" y="172" width="200" height="7" rx="3.5" fill="#0e2a26"/>
        <rect x="300" y="172" width="0" height="7" rx="3.5" fill="#00ff9c" filter="url(#tglow)">
          <animate attributeName="width" values="0;0;200;200;200" keyTimes="0;0.1836;0.238;0.94;1" dur="16s" repeatCount="indefinite"/>
        </rect>
        <text x="516" y="182" fill="#00ff9c" fill-opacity=".8">ACTIVE</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1972;0.2108;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
        <text x="30" y="210" fill="#00e5ff">[02] OSINT FRAMEWORKS</text>
        <rect x="300" y="200" width="200" height="7" rx="3.5" fill="#0e2430"/>
        <rect x="300" y="200" width="0" height="7" rx="3.5" fill="#00e5ff" filter="url(#tglow)">
          <animate attributeName="width" values="0;0;200;200;200" keyTimes="0;0.204;0.2584;0.94;1" dur="16s" repeatCount="indefinite"/>
        </rect>
        <text x="516" y="210" fill="#00e5ff" fill-opacity=".8">ACTIVE</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2176;0.2312;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
        <text x="30" y="238" fill="#ff2e63">[03] PENETRATION TESTING</text>
        <rect x="300" y="228" width="200" height="7" rx="3.5" fill="#2c101b"/>
        <rect x="300" y="228" width="0" height="7" rx="3.5" fill="#ff2e63" filter="url(#tglow)">
          <animate attributeName="width" values="0;0;200;200;200" keyTimes="0;0.2244;0.2788;0.94;1" dur="16s" repeatCount="indefinite"/>
        </rect>
        <text x="516" y="238" fill="#ff2e63" fill-opacity=".8">ACTIVE</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.238;0.2516;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
        <text x="30" y="266" fill="#f9a826">[04] AUTOMATION</text>
        <rect x="300" y="256" width="200" height="7" rx="3.5" fill="#2b2110"/>
        <rect x="300" y="256" width="0" height="7" rx="3.5" fill="#f9a826" filter="url(#tglow)">
          <animate attributeName="width" values="0;0;200;200;200" keyTimes="0;0.2448;0.2992;0.94;1" dur="16s" repeatCount="indefinite"/>
        </rect>
        <text x="516" y="266" fill="#f9a826" fill-opacity=".8">ACTIVE</text>
      </g>
    </g>

    <!-- line 8 : helix run -->
    <g clip-path="url(#l8)">
      <text class="m" x="30" y="300"><tspan class="p">root@thalha</tspan><tspan fill="#4d7f6d">:~#</tspan><tspan fill="#dff7ef"> ./helix --map-identity --deep</tspan></text>
    </g>

    <!-- helix progress -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3672;0.3808;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
      <rect x="30" y="322" width="470" height="9" rx="4.5" fill="#0e2a26"/>
      <rect x="30" y="322" width="0" height="9" rx="4.5" fill="#00ff9c" filter="url(#tglow)">
        <animate attributeName="width" values="0;0;470;470;470" keyTimes="0;0.374;0.5168;0.94;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text class="m s" x="516" y="331" fill="#00ff9c" fill-opacity=".85">
        scanning
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.51;0.5236;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text class="m s" x="516" y="331" fill="#00ff9c" opacity="0">
        complete
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5236;0.5372;1" dur="16s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- result -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5304;0.5508;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
      <text class="m s" x="30" y="360"><tspan fill="#00ff9c">✓</tspan><tspan fill="#8bb8ac"> identity graph resolved · profiles correlated · </tspan><tspan fill="#00ff9c">0 false positives</tspan></text>
    </g>

    <!-- cursors -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0136;0.0816;0.0884;1" dur="16s" repeatCount="indefinite"/>
      <rect y="63" width="9" height="19" fill="#00ff9c" x="30">
        <animate attributeName="x" values="30;30;219;219" keyTimes="0;0.0136;0.0612;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.102;0.1768;0.1836;1" dur="16s" repeatCount="indefinite"/>
      <rect y="131" width="9" height="19" fill="#00ff9c" x="30">
        <animate attributeName="x" values="30;30;390;390" keyTimes="0;0.102;0.1632;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.2856;0.94;0.97;1" dur="16s" repeatCount="indefinite"/>
      <rect class="blink" y="285" width="9" height="19" fill="#00ff9c" x="30">
        <animate attributeName="x" values="30;30;426;426" keyTimes="0;0.2856;0.3604;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="none" stroke="#00ff9c" stroke-opacity=".28"/>
  </g>
</svg>
