<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Animated data stream divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#00ff9c" stop-opacity=".45"/>
      <stop offset="0.85" stop-color="#00ff9c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#dl)" stroke-width="1.2"/>

  <g fill="#00ff9c" filter="url(#dg)">
    <circle r="3" cy="12" cx="0">
      <animate attributeName="cx" values="-20;1220" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" cy="12" cx="0" fill="#00e5ff">
      <animate attributeName="cx" values="-20;1220" dur="5.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" cy="12" cx="0" fill="#ff2e63">
      <animate attributeName="cx" values="1220;-20" dur="6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#00ff9c" fill-opacity=".35">
    <rect x="592" y="8" width="2" height="8"/>
    <rect x="598" y="5" width="2" height="14"/>
    <rect x="604" y="8" width="2" height="8"/>
  </g>
</svg>
