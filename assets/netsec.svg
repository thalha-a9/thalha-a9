<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Network security port reconnaissance panel">
  <title>[01] Network Security — live port recon</title>
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06121a"/><stop offset="1" stop-color="#04090c"/>
    </linearGradient>
    <linearGradient id="sweepline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <filter id="ng" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nf"><rect width="520" height="300" rx="9"/></clipPath>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px}
      .t{font-size:12px}
      .dot{stroke:#00ff9c;stroke-opacity:.22;stroke-width:1;stroke-dasharray:2 5}
    </style>
  </defs>

  <g clip-path="url(#nf)">
    <rect width="520" height="300" fill="url(#nbg)"/>

    <!-- header -->
    <rect width="520" height="32" fill="#08202a"/>
    <line x1="0" y1="32" x2="520" y2="32" stroke="#00ff9c" stroke-opacity=".3"/>
    <circle cx="18" cy="16" r="4" fill="#00ff9c">
      <animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="32" y="21" fill="#00ff9c" letter-spacing="1.5">NETWORK SECURITY</text>
    <text class="m t" x="502" y="20" text-anchor="end" fill="#4d7f6d" letter-spacing="1">tcp/syn scan</text>

    <!-- target -->
    <text class="m t" x="20" y="56" fill="#4d7f6d">target</text>
    <text class="m t" x="70" y="56" fill="#dff7ef">10.0.0.0/24</text>
    <text class="m t" x="190" y="56" fill="#4d7f6d">hosts up</text>
    <text class="m t" x="258" y="56" fill="#00e5ff">24</text>
    <text class="m t" x="500" y="56" text-anchor="end" fill="#4d7f6d">
      <tspan fill="#00ff9c">▲</tspan> capturing
    </text>
    <line x1="20" y1="66" x2="500" y2="66" stroke="#00ff9c" stroke-opacity=".15"/>

    <!-- sweep -->
    <rect x="20" y="80" width="480" height="2" fill="url(#sweepline)" filter="url(#ng)">
      <animate attributeName="y" values="80;250;80" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.5;.9" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- rows -->
    <g class="m t">
      <g>
        <text x="20" y="94" fill="#dff7ef">22/tcp</text>
        <text x="86" y="94" fill="#4d7f6d">ssh</text>
        <line class="dot" x1="162" y1="90" x2="380" y2="90"/>
        <text x="500" y="94" text-anchor="end" fill="#4d7f6d">
          scanning<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.12;0.14;0.965;0.985;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="94" text-anchor="end" fill="#00ff9c" opacity="0">
          OPEN<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.13;0.15;0.965;0.98;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <circle r="2.4" fill="#00ff9c" opacity="0" filter="url(#ng)">
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.14;1" dur="9s" repeatCount="indefinite"/>
          <animateMotion dur="9s" keyPoints="0;0;1;1" keyTimes="0;0.03;0.13;1" calcMode="linear" repeatCount="indefinite" path="M162 90 L380 90"/>
        </circle>
      </g>
      <g>
        <text x="20" y="128" fill="#dff7ef">80/tcp</text>
        <text x="86" y="128" fill="#4d7f6d">http</text>
        <line class="dot" x1="162" y1="124" x2="380" y2="124"/>
        <text x="500" y="128" text-anchor="end" fill="#4d7f6d">
          scanning<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.30;0.32;0.965;0.985;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="128" text-anchor="end" fill="#00ff9c" opacity="0">
          OPEN<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.33;0.965;0.98;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <circle r="2.4" fill="#00ff9c" opacity="0" filter="url(#ng)">
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.21;0.30;0.32;1" dur="9s" repeatCount="indefinite"/>
          <animateMotion dur="9s" keyPoints="0;0;1;1" keyTimes="0;0.21;0.31;1" calcMode="linear" repeatCount="indefinite" path="M162 124 L380 124"/>
        </circle>
      </g>
      <g>
        <text x="20" y="162" fill="#dff7ef">443/tcp</text>
        <text x="86" y="162" fill="#4d7f6d">https</text>
        <line class="dot" x1="162" y1="158" x2="380" y2="158"/>
        <text x="500" y="162" text-anchor="end" fill="#4d7f6d">
          scanning<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.48;0.50;0.965;0.985;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="162" text-anchor="end" fill="#00ff9c" opacity="0">
          OPEN<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.51;0.965;0.98;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <circle r="2.4" fill="#00ff9c" opacity="0" filter="url(#ng)">
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.39;0.48;0.50;1" dur="9s" repeatCount="indefinite"/>
          <animateMotion dur="9s" keyPoints="0;0;1;1" keyTimes="0;0.39;0.49;1" calcMode="linear" repeatCount="indefinite" path="M162 158 L380 158"/>
        </circle>
      </g>
      <g>
        <text x="20" y="196" fill="#dff7ef">3306/tcp</text>
        <text x="86" y="196" fill="#4d7f6d">mysql</text>
        <line class="dot" x1="162" y1="192" x2="380" y2="192"/>
        <text x="500" y="196" text-anchor="end" fill="#4d7f6d">
          scanning<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.66;0.68;0.965;0.985;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="196" text-anchor="end" fill="#ff2e63" opacity="0">
          FILTERED<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.67;0.69;0.965;0.98;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <circle r="2.4" fill="#ff2e63" opacity="0" filter="url(#ng)">
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.57;0.66;0.68;1" dur="9s" repeatCount="indefinite"/>
          <animateMotion dur="9s" keyPoints="0;0;1;1" keyTimes="0;0.57;0.67;1" calcMode="linear" repeatCount="indefinite" path="M162 192 L380 192"/>
        </circle>
      </g>
      <g>
        <text x="20" y="230" fill="#dff7ef">8443/tcp</text>
        <text x="86" y="230" fill="#4d7f6d">alt-https</text>
        <line class="dot" x1="162" y1="226" x2="380" y2="226"/>
        <text x="500" y="230" text-anchor="end" fill="#4d7f6d">
          scanning<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.84;0.86;0.965;0.985;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="230" text-anchor="end" fill="#00e5ff" opacity="0">
          OPEN<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.85;0.87;0.965;0.98;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <circle r="2.4" fill="#00e5ff" opacity="0" filter="url(#ng)">
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.75;0.84;0.86;1" dur="9s" repeatCount="indefinite"/>
          <animateMotion dur="9s" keyPoints="0;0;1;1" keyTimes="0;0.75;0.85;1" calcMode="linear" repeatCount="indefinite" path="M162 226 L380 226"/>
        </circle>
      </g>
    </g>

    <!-- footer -->
    <line x1="20" y1="252" x2="500" y2="252" stroke="#00ff9c" stroke-opacity=".15"/>
    <text class="m t" x="20" y="274" fill="#4d7f6d">packet analysis · traffic inspection · hardening</text>
    <g>
      <rect x="440" y="264" width="60" height="16" rx="8" fill="#0e2a26" stroke="#00ff9c" stroke-opacity=".4"/>
      <text class="m t" x="470" y="275" text-anchor="middle" fill="#00ff9c" font-size="9.5" letter-spacing="1">SECURE</text>
      <animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <rect x="0.5" y="0.5" width="519" height="299" rx="9" fill="none" stroke="#00ff9c" stroke-opacity=".3"/>
  </g>
</svg>
