<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="Tech stack: Python asyncio, Bash, Linux, Git, OSINT, network security, penetration testing, automation">
  <title>Tech stack &amp; specializations</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <filter id="sg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;letter-spacing:1px}
      .pill{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .led{animation:led 2.4s ease-in-out infinite}
      @keyframes led{0%,100%{opacity:.3}50%{opacity:1}}
      .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}
      .d5{animation-delay:.45s}.d6{animation-delay:.55s}.d7{animation-delay:.65s}.d8{animation-delay:.75s}
    </style>
  </defs>

  <rect width="900" height="170" fill="#04090c" rx="9"/>
  <text class="m" x="450" y="26" text-anchor="middle" fill="#4d7f6d" font-size="11">— ARSENAL —</text>

  <!-- row 1 -->
  <g class="m">
    <g class="pill d1">
      <rect x="179" y="46" width="190" height="34" rx="17" fill="#0b1f1a" stroke="#00ff9c" stroke-opacity=".55"/>
      <circle class="led" cx="199" cy="63" r="3.5" fill="#00ff9c" filter="url(#sg)"/>
      <text x="214" y="67" fill="#dff7ef">PYTHON · ASYNCIO</text>
    </g>
    <g class="pill d2">
      <rect x="383" y="46" width="110" height="34" rx="17" fill="#0b1f1a" stroke="#00ff9c" stroke-opacity=".45"/>
      <circle class="led" cx="403" cy="63" r="3.5" fill="#00ff9c" filter="url(#sg)" style="animation-delay:.3s"/>
      <text x="418" y="67" fill="#dff7ef">BASH</text>
    </g>
    <g class="pill d3">
      <rect x="507" y="46" width="110" height="34" rx="17" fill="#0b1f1a" stroke="#00ff9c" stroke-opacity=".45"/>
      <circle class="led" cx="527" cy="63" r="3.5" fill="#00ff9c" filter="url(#sg)" style="animation-delay:.6s"/>
      <text x="542" y="67" fill="#dff7ef">LINUX</text>
    </g>
    <g class="pill d4">
      <rect x="631" y="46" width="90" height="34" rx="17" fill="#0b1f1a" stroke="#00ff9c" stroke-opacity=".45"/>
      <circle class="led" cx="651" cy="63" r="3.5" fill="#00ff9c" filter="url(#sg)" style="animation-delay:.9s"/>
      <text x="666" y="67" fill="#dff7ef">GIT</text>
    </g>
  </g>

  <!-- row 2 : specializations -->
  <g class="m">
    <g class="pill d5">
      <rect x="54" y="104" width="190" height="34" rx="17" fill="#0b1f1a" stroke="#00ff9c" stroke-opacity=".7"/>
      <circle class="led" cx="74" cy="121" r="3.5" fill="#00ff9c" filter="url(#sg)"/>
      <text x="89" y="125" fill="#00ff9c">NETWORK SECURITY</text>
    </g>
    <g class="pill d6">
      <rect x="258" y="104" width="200" height="34" rx="17" fill="#08222b" stroke="#00e5ff" stroke-opacity=".7"/>
      <circle class="led" cx="278" cy="121" r="3.5" fill="#00e5ff" filter="url(#sg)" style="animation-delay:.4s"/>
      <text x="293" y="125" fill="#00e5ff">OSINT FRAMEWORKS</text>
    </g>
    <g class="pill d7">
      <rect x="472" y="104" width="210" height="34" rx="17" fill="#26101a" stroke="#ff2e63" stroke-opacity=".7"/>
      <circle class="led" cx="492" cy="121" r="3.5" fill="#ff2e63" filter="url(#sg)" style="animation-delay:.8s"/>
      <text x="507" y="125" fill="#ff2e63">PENETRATION TESTING</text>
    </g>
    <g class="pill d8">
      <rect x="696" y="104" width="150" height="34" rx="17" fill="#241d0e" stroke="#f9a826" stroke-opacity=".7"/>
      <circle class="led" cx="716" cy="121" r="3.5" fill="#f9a826" filter="url(#sg)" style="animation-delay:1.2s"/>
      <text x="731" y="125" fill="#f9a826">AUTOMATION</text>
    </g>
  </g>

  <!-- sweeping highlight -->
  <rect x="-240" y="36" width="240" height="112" fill="url(#band)">
    <animate attributeName="x" values="-240;900" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="0.5" y="0.5" width="899" height="169" rx="9" fill="none" stroke="#00ff9c" stroke-opacity=".22"/>
</svg>
