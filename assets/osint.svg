<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="OSINT identity correlation graph panel">
  <title>[02] OSINT Frameworks — identity correlation</title>
  <defs>
    <linearGradient id="obg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061620"/><stop offset="1" stop-color="#04090c"/>
    </linearGradient>
    <filter id="og" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="of"><rect width="520" height="300" rx="9"/></clipPath>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px}
      .t{font-size:12px}
      .e{fill:none;stroke:#00e5ff;stroke-width:1.3;stroke-opacity:.55;stroke-dasharray:320}
    </style>
  </defs>

  <g clip-path="url(#of)">
    <rect width="520" height="300" fill="url(#obg)"/>

    <!-- header -->
    <rect width="520" height="32" fill="#07222b"/>
    <line x1="0" y1="32" x2="520" y2="32" stroke="#00e5ff" stroke-opacity=".35"/>
    <circle cx="18" cy="16" r="4" fill="#00e5ff">
      <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="32" y="21" fill="#00e5ff" letter-spacing="1.5">OSINT FRAMEWORKS</text>
    <text class="m t" x="502" y="20" text-anchor="end" fill="#3d7286" letter-spacing="1">identity mapping</text>

    <!-- edges -->
    <g>
      <path class="e" d="M118 150 Q 215 150 306 70">
        <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.06;0.14;0.95;1" dur="12s" repeatCount="indefinite"/>
      </path>
      <path class="e" d="M118 150 Q 215 150 306 110">
        <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.15;0.23;0.95;1" dur="12s" repeatCount="indefinite"/>
      </path>
      <path class="e" d="M118 150 L 306 150">
        <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.24;0.32;0.95;1" dur="12s" repeatCount="indefinite"/>
      </path>
      <path class="e" d="M118 150 Q 215 150 306 190">
        <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.33;0.41;0.95;1" dur="12s" repeatCount="indefinite"/>
      </path>
      <path class="e" d="M118 150 Q 215 150 306 230" stroke="#ff2e63" stroke-opacity=".5">
        <animate attributeName="stroke-dashoffset" values="320;320;0;0;320" keyTimes="0;0.42;0.50;0.95;1" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- target node -->
    <circle cx="100" cy="150" r="17" fill="#062430" stroke="#00e5ff" stroke-width="1.6"/>
    <circle cx="100" cy="150" r="5" fill="#00e5ff" filter="url(#og)"/>
    <circle cx="100" cy="150" r="17" fill="none" stroke="#00e5ff">
      <animate attributeName="r" values="17;40" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text class="m t" x="100" y="196" text-anchor="middle" fill="#3d7286" letter-spacing="1">TARGET</text>

    <!-- surfaces -->
    <g class="m t">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.16;0.95;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="306" cy="70" r="6" fill="#062430" stroke="#00e5ff" stroke-width="1.4"/>
        <text x="322" y="74" fill="#cfeef7">node_01 · dev</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.25;0.95;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="306" cy="110" r="6" fill="#062430" stroke="#00e5ff" stroke-width="1.4"/>
        <text x="322" y="114" fill="#cfeef7">node_02 · blog</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.34;0.95;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="306" cy="150" r="6" fill="#062430" stroke="#00e5ff" stroke-width="1.4"/>
        <text x="322" y="154" fill="#cfeef7">node_03 · social</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.43;0.95;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="306" cy="190" r="6" fill="#062430" stroke="#00e5ff" stroke-width="1.4"/>
        <text x="322" y="194" fill="#cfeef7">node_04 · forum</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.52;0.95;1" dur="12s" repeatCount="indefinite"/>
        <circle cx="306" cy="230" r="6" fill="#1e0d14" stroke="#ff2e63" stroke-width="1.4"/>
        <text x="322" y="234" fill="#a86b7d">node_05 · archive</text>
      </g>
    </g>

    <!-- verification marks -->
    <g class="m t" text-anchor="middle">
      <text x="494" y="75" fill="#00ff9c" opacity="0">✓
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.57;0.59;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="494" y="115" fill="#00ff9c" opacity="0">✓
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.61;0.63;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="494" y="155" fill="#00ff9c" opacity="0">✓
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.67;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="494" y="195" fill="#00ff9c" opacity="0">✓
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.69;0.71;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="494" y="235" fill="#ff2e63" opacity="0">✗
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.73;0.75;0.95;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- footer -->
    <line x1="20" y1="256" x2="500" y2="256" stroke="#00e5ff" stroke-opacity=".15"/>
    <g class="m t">
      <text x="20" y="278" fill="#3d7286">
        awaiting correlation
        <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.79;0.81;0.965;0.985;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="278" opacity="0">
        <tspan fill="#00e5ff">5</tspan><tspan fill="#3d7286"> surfaces correlated · </tspan><tspan fill="#00ff9c">4 verified</tspan><tspan fill="#3d7286"> · </tspan><tspan fill="#ff2e63">1 rejected</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.80;0.83;0.965;0.98;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="0.5" y="0.5" width="519" height="299" rx="9" fill="none" stroke="#00e5ff" stroke-opacity=".3"/>
  </g>
</svg>
