<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Automation pipeline panel">
  <title>[04] Automation — pipeline orchestration</title>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191305"/><stop offset="1" stop-color="#0a0803"/>
    </linearGradient>
    <filter id="ag" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="af"><rect width="520" height="300" rx="9"/></clipPath>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px}
      .t{font-size:12px}
      .s{font-size:11px}
      .box{fill:#1c1608;stroke:#f9a826;stroke-opacity:.3;stroke-width:1.2}
    </style>
  </defs>

  <g clip-path="url(#af)">
    <rect width="520" height="300" fill="url(#abg)"/>

    <!-- header -->
    <rect width="520" height="32" fill="#2a2009"/>
    <line x1="0" y1="32" x2="520" y2="32" stroke="#f9a826" stroke-opacity=".4"/>
    <circle cx="18" cy="16" r="4" fill="#f9a826">
      <animate attributeName="opacity" values="1;.2;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="32" y="21" fill="#f9a826" letter-spacing="1.5">AUTOMATION</text>
    <text class="m t" x="502" y="20" text-anchor="end" fill="#8a7440" letter-spacing="1">pipeline</text>

    <!-- connectors -->
    <g stroke="#f9a826" stroke-opacity=".3" stroke-width="1.2">
      <path d="M125 84 H145" marker-end=""/><path d="M139 79 L145 84 L139 89" fill="none"/>
      <path d="M250 84 H270"/><path d="M264 79 L270 84 L264 89" fill="none"/>
      <path d="M375 84 H395"/><path d="M389 79 L395 84 L389 89" fill="none"/>
    </g>

    <!-- stages -->
    <g class="m s" text-anchor="middle">
      <g>
        <rect class="box" x="20" y="64" width="105" height="40" rx="6"/>
        <rect x="20" y="64" width="105" height="40" rx="6" fill="#f9a826" fill-opacity="0" stroke="#f9a826" stroke-opacity="0" stroke-width="1.6">
          <animate attributeName="fill-opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.06;0.09;0.16;0.20;1" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.06;0.09;0.16;0.20;1" dur="12s" repeatCount="indefinite"/>
        </rect>
        <text x="72" y="88" fill="#f6dfae" letter-spacing="1">TRIGGER</text>
      </g>
      <g>
        <rect class="box" x="145" y="64" width="105" height="40" rx="6"/>
        <rect x="145" y="64" width="105" height="40" rx="6" fill="#f9a826" fill-opacity="0" stroke="#f9a826" stroke-opacity="0" stroke-width="1.6">
          <animate attributeName="fill-opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.20;0.23;0.30;0.34;1" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.20;0.23;0.30;0.34;1" dur="12s" repeatCount="indefinite"/>
        </rect>
        <text x="197" y="88" fill="#f6dfae" letter-spacing="1">PARSE</text>
      </g>
      <g>
        <rect class="box" x="270" y="64" width="105" height="40" rx="6"/>
        <rect x="270" y="64" width="105" height="40" rx="6" fill="#f9a826" fill-opacity="0" stroke="#f9a826" stroke-opacity="0" stroke-width="1.6">
          <animate attributeName="fill-opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.34;0.37;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.34;0.37;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
        </rect>
        <text x="322" y="88" fill="#f6dfae" letter-spacing="1">EXECUTE</text>
      </g>
      <g>
        <rect class="box" x="395" y="64" width="105" height="40" rx="6"/>
        <rect x="395" y="64" width="105" height="40" rx="6" fill="#f9a826" fill-opacity="0" stroke="#f9a826" stroke-opacity="0" stroke-width="1.6">
          <animate attributeName="fill-opacity" values="0;0;0.12;0.12;0;0" keyTimes="0;0.48;0.51;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.48;0.51;0.58;0.62;1" dur="12s" repeatCount="indefinite"/>
        </rect>
        <text x="447" y="88" fill="#f6dfae" letter-spacing="1">REPORT</text>
      </g>
    </g>

    <!-- token -->
    <circle r="4" fill="#f9a826" filter="url(#ag)" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.60;0.64;1" dur="12s" repeatCount="indefinite"/>
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
        path="M72 84 L197 84 L322 84 L447 84"
        keyPoints="0;0;0.333;0.333;0.667;0.667;1;1"
        keyTimes="0;0.08;0.19;0.22;0.33;0.36;0.47;1"/>
    </circle>

    <!-- job queue -->
    <line x1="20" y1="124" x2="500" y2="124" stroke="#f9a826" stroke-opacity=".15"/>
    <g class="m t">
      <g>
        <text x="20" y="152" fill="#e8d3a6">recon-sweep.py</text>
        <rect x="300" y="142" width="120" height="6" rx="3" fill="#2b2110"/>
        <rect x="300" y="142" width="0" height="6" rx="3" fill="#f9a826">
          <animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.10;0.30;0.95;1" dur="12s" repeatCount="indefinite"/>
        </rect>
        <text x="500" y="152" text-anchor="end" fill="#8a7440">
          queued<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.30;0.32;0.965;0.985;1" dur="12s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="152" text-anchor="end" fill="#00ff9c" opacity="0">
          done<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.33;0.965;0.98;1" dur="12s" repeatCount="indefinite"/>
        </text>
      </g>
      <g>
        <text x="20" y="184" fill="#e8d3a6">backup-vault.sh</text>
        <rect x="300" y="174" width="120" height="6" rx="3" fill="#2b2110"/>
        <rect x="300" y="174" width="0" height="6" rx="3" fill="#f9a826">
          <animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.30;0.50;0.95;1" dur="12s" repeatCount="indefinite"/>
        </rect>
        <text x="500" y="184" text-anchor="end" fill="#8a7440">
          queued<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.50;0.52;0.965;0.985;1" dur="12s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="184" text-anchor="end" fill="#00ff9c" opacity="0">
          done<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.51;0.53;0.965;0.98;1" dur="12s" repeatCount="indefinite"/>
        </text>
      </g>
      <g>
        <text x="20" y="216" fill="#e8d3a6">notify-digest.sh</text>
        <rect x="300" y="206" width="120" height="6" rx="3" fill="#2b2110"/>
        <rect x="300" y="206" width="0" height="6" rx="3" fill="#f9a826">
          <animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.50;0.70;0.95;1" dur="12s" repeatCount="indefinite"/>
        </rect>
        <text x="500" y="216" text-anchor="end" fill="#8a7440">
          queued<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.70;0.72;0.965;0.985;1" dur="12s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="216" text-anchor="end" fill="#00ff9c" opacity="0">
          done<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.71;0.73;0.965;0.98;1" dur="12s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>

    <!-- footer -->
    <line x1="20" y1="244" x2="500" y2="244" stroke="#f9a826" stroke-opacity=".15"/>
    <text class="m t" x="20" y="268" fill="#8a7440">scheduled · idempotent · retry-safe · logged</text>
    <g>
      <rect x="424" y="256" width="76" height="17" rx="8.5" fill="#2b2110" stroke="#f9a826" stroke-opacity=".45"/>
      <text class="m s" x="462" y="268" text-anchor="middle" fill="#f9a826" letter-spacing="1">HANDS-OFF</text>
    </g>

    <rect x="0.5" y="0.5" width="519" height="299" rx="9" fill="none" stroke="#f9a826" stroke-opacity=".3"/>
  </g>
</svg>
